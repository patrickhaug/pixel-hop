name: CI

on:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - run: xcodebuild -version

      - name: Pick simulator
        id: sim
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          phones = [d for runtime in sorted(devices, reverse=True) if ".iOS-" in runtime for d in devices[runtime] if d["name"].startswith("iPhone")]
          print(phones[0]["udid"])
          ')
          echo "udid=$UDID" >> "$GITHUB_OUTPUT"
          xcrun simctl list devices | grep "$UDID"

      - name: Build for simulator
        run: |
          xcodebuild build \
            -project PixelHop.xcodeproj \
            -scheme PixelHop \
            -destination "id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/build" \
            CODE_SIGNING_ALLOWED=NO

      - name: Screenshots
        continue-on-error: true
        env:
          UDID: ${{ steps.sim.outputs.udid }}
        run: |
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID" -b
          xcrun simctl install "$UDID" "$RUNNER_TEMP/build/Build/Products/Debug-iphonesimulator/PixelHop.app"
          shoot() {
            name="$1"
            shift
            xcrun simctl launch "$UDID" dev.patrickhaug.pixelhop "$@"
            sleep 20
            xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/$name.png"
            sips -s format jpeg -s formatOptions 60 -Z 640 "$RUNNER_TEMP/$name.png" --out "$RUNNER_TEMP/$name.jpg"
            echo "SCREENSHOT-BEGIN $name"
            base64 -b 76 -i "$RUNNER_TEMP/$name.jpg"
            echo "SCREENSHOT-END $name"
            xcrun simctl terminate "$UDID" dev.patrickhaug.pixelhop
          }
          shoot start
          shoot talk -screenshotTalk YES
          shoot village -screenshotStart 3.5,-55.5
          xcrun simctl spawn "$UDID" log show --last 3m --style compact --predicate 'process == "PixelHop"' | tail -n 60

      - name: Upload screenshot
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: ${{ runner.temp }}/*.png
          if-no-files-found: ignore
